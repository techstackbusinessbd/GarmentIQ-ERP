services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL 16 Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: garments_erp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: garments_erp_db
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_password_secure123
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../scripts/seed-garments-master-data.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user -d garments_erp_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - garments_erp_net

  # ---------------------------------------------------------------------------
  # 2. Java 21 / Spring Boot 3.3+ Backend
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: garments_erp_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/garments_erp_db
      SPRING_DATASOURCE_USERNAME: erp_user
      SPRING_DATASOURCE_PASSWORD: erp_password_secure123
      SPRING_THREADS_VIRTUAL_ENABLED: "true"
    ports:
      - "${BACKEND_PORT:-8081}:8080"
    volumes:
      - ../backend:/app
      - maven_cache:/root/.m2
    networks:
      - garments_erp_net

  # ---------------------------------------------------------------------------
  # 3. React 19 + Tailwind CSS v4 + Vite Frontend
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: garments_erp_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:${BACKEND_PORT:-8081}/api/v1
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    networks:
      - garments_erp_net

  # ---------------------------------------------------------------------------
  # 4. pgAdmin (Database Inspection UI)
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: garments_erp_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@garmentserp.com
      PGADMIN_DEFAULT_PASSWORD: admin_password_123
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - postgres
    networks:
      - garments_erp_net

  # ---------------------------------------------------------------------------
  # 5. Redis 7 (Distributed L2 Cache)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: garments_erp_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    networks:
      - garments_erp_net

  # ---------------------------------------------------------------------------
  # 6. MinIO (S3-Compatible Object Storage)
  # ---------------------------------------------------------------------------
  minio:
    profiles:
      - storage
    image: minio/minio:latest
    container_name: garments_erp_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password_secure123
    ports:
      - "${MINIO_API_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9003}:9001"
    volumes:
      - minio_data:/data
    networks:
      - garments_erp_net

volumes:
  postgres_data:
    driver: local
  maven_cache:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  garments_erp_net:
    driver: bridge

