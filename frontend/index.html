<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Garments ERP | Enterprise RMG Woven, Denim & Traceability Platform</title>
    <!-- [EN] Preconnect Google Fonts for Inter and JetBrains Mono / [BN] ইন্টার ও জেটব্রেইন্স মনো ফন্ট প্রি-কানেক্ট -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          const t = localStorage.getItem('garments_erp_theme') || 'indigo';
          document.documentElement.setAttribute('data-theme', t);
          if (t === 'obsidian') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-surface-base text-text-primary antialiased font-sans selection:bg-brand-accent selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
